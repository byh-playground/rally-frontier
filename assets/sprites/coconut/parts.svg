<svg xmlns="http://www.w3.org/2000/svg" width="900" height="800" viewBox="0 0 900 800">
  <!--
    코코넛 파츠 시트 시안 B 반쯤 깨져 흰 속살이 보임. 호두 parts.svg와 같은 셀 배치·회전 중심·조립 위치(sprite.js의 CELLS를 그대로 쓸 수 있음).
    셀 좌표는 [x, y, w, h] / 회전 중심 [px, py] (셀 왼쪽 위 기준). 껍데기 반지름 약 100 (외곽선 바깥 약 103, 눈 구멍 쪽 끝 약 107).
    실물 근거: 통 코코넛(갈색 섬유, 거의 둥글고 눈 구멍 쪽이 살짝 뾰족, 섬유가 눈 구멍에서 퍼져 감싸 돎, 세 눈 구멍) + 깨진 코코넛(얇은 진갈색 껍데기 테, 두꺼운 흰 속살).
    섬유는 굵은 획 몇 개만. 섬유·눈 구멍·깨진 자리은 공 중심에서 반지름 66 바깥이라 어느 각도로 돌아도 얼굴 자리는 매끈한 면.
    얼굴은 쌀·찹쌀과 같은 점눈(까만 세로 타원 + 흰 하이라이트 한 점)·분홍 볼·작은 입.

    구르는 조립 (원점 = 공 중심, 땅 접점은 (0, +101). 진행 방향 +x, 왼쪽으로 갈 때는 전체를 좌우 반전)
      shell       [10,10,250,250] / [125,125]   회전하는 껍데기. 섬유·세 눈 구멍·깨진 자리. 이 셀만 돈다.
      shade       [270,10,220,220] / [110,110]  돌지 않는 빛·그늘 덧칠(반투명).
      face-*      160x80 / [80,40]              돌지 않는 얼굴. 공 중심에서 (+14,+6).
                  neutral [10,300]  happy [180,300]  rush [350,300]  bump [520,300]  hurt [690,300]
      spin-arcs   [500,10,280,280] / [140,140]
      streaks-mid [10,400,340,220] / [330,110]   streaks-max [360,400,530,220] / [520,110]
      dust-slow   [10,630,200,70] / [190,60]     dust-max    [220,630,330,160] / [320,140]
      impact      [560,630,230,160] / [110,90]
  -->
  <defs>
    <radialGradient id="shell-fill" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#d09559"/>
      <stop offset=".66" stop-color="#b87743"/>
      <stop offset="1" stop-color="#9a5b33"/>
    </radialGradient>
    <radialGradient id="shade-fill" cx=".34" cy=".3" r=".78">
      <stop offset="0" stop-color="#ffe9cc" stop-opacity=".45"/>
      <stop offset=".36" stop-color="#ffe9cc" stop-opacity="0"/>
      <stop offset=".68" stop-color="#3e1f0e" stop-opacity="0"/>
      <stop offset="1" stop-color="#3e1f0e" stop-opacity=".3"/>
    </radialGradient>
    <path id="outline" d="M100.4 0.0C100.5 2.9 100.5 5.9 100.2 8.8C99.9 11.7 99.4 14.6 98.8 17.4C98.2 20.3 97.4 23.1 96.5 25.9C95.6 28.6 94.6 31.3 93.5 34.0C92.4 36.7 91.3 39.4 90.0 42.0C88.8 44.6 87.5 47.2 86.1 49.7C84.7 52.2 83.2 54.7 81.6 57.1C79.9 59.5 78.2 61.8 76.3 64.0C74.4 66.2 72.4 68.3 70.3 70.3C68.2 72.2 65.9 74.1 63.6 75.8C61.3 77.6 58.9 79.2 56.5 80.8C54.2 82.3 51.7 83.8 49.2 85.3C46.8 86.8 44.3 88.2 41.8 89.6C39.2 90.9 36.7 92.3 34.0 93.5C31.4 94.7 28.7 95.9 25.9 96.8C23.2 97.8 20.3 98.6 17.5 99.2C14.6 99.8 11.7 100.1 8.8 100.3C5.9 100.5 2.9 100.5 0.0 100.3C-2.9 100.1 -5.8 99.7 -8.7 99.3C-11.6 98.8 -14.4 98.3 -17.2 97.6C-20.0 97.0 -22.8 96.3 -25.6 95.5C-28.4 94.7 -31.1 93.9 -33.8 93.0C-36.6 92.1 -39.3 91.1 -41.9 89.9C-44.6 88.8 -47.2 87.5 -49.7 86.1C-52.2 84.6 -54.6 83.1 -57.0 81.4C-59.3 79.7 -61.6 77.9 -63.7 76.0C-65.9 74.0 -67.9 72.0 -70.0 70.0C-72.0 67.9 -73.9 65.8 -75.8 63.6C-77.7 61.4 -79.6 59.2 -81.3 57.0C-83.1 54.7 -84.9 52.4 -86.5 49.9C-88.1 47.5 -89.7 45.0 -91.1 42.5C-92.4 39.9 -93.7 37.2 -94.7 34.5C-95.7 31.7 -96.5 28.9 -97.1 26.0C-97.8 23.2 -98.2 20.3 -98.5 17.4C-98.7 14.5 -98.8 11.5 -98.9 8.6C-98.9 5.8 -98.8 2.9 -98.6 0.0C-98.5 -2.9 -98.3 -5.7 -98.1 -8.6C-97.8 -11.4 -97.6 -14.3 -97.2 -17.1C-96.8 -20.0 -96.3 -22.8 -95.7 -25.6C-95.1 -28.5 -94.4 -31.3 -93.5 -34.0C-92.6 -36.8 -91.5 -39.5 -90.3 -42.1C-89.1 -44.7 -87.7 -47.3 -86.2 -49.8C-84.8 -52.3 -83.1 -54.7 -81.4 -57.0C-79.8 -59.4 -78.0 -61.7 -76.1 -63.9C-74.3 -66.1 -72.4 -68.3 -70.4 -70.4C-68.5 -72.6 -66.4 -74.7 -64.3 -76.6C-62.2 -78.6 -59.9 -80.5 -57.6 -82.3C-55.3 -84.0 -52.8 -85.6 -50.3 -87.0C-47.7 -88.5 -45.0 -89.7 -42.3 -90.8C-39.6 -91.9 -36.8 -92.7 -34.0 -93.5C-31.2 -94.3 -28.4 -94.9 -25.6 -95.4C-22.7 -96.0 -19.9 -96.4 -17.1 -96.9C-14.2 -97.3 -11.4 -97.7 -8.6 -98.1C-5.7 -98.4 -2.9 -98.8 -0.0 -99.0C2.9 -99.3 5.8 -99.5 8.7 -99.5C11.6 -99.6 14.6 -99.6 17.5 -99.4C20.5 -99.2 23.4 -98.9 26.4 -98.3C29.3 -97.8 32.2 -97.2 35.1 -96.4C37.9 -95.6 40.8 -94.6 43.6 -93.5C46.4 -92.4 49.2 -91.2 51.9 -89.9C54.6 -88.6 57.3 -87.1 59.9 -85.5C62.5 -83.9 65.0 -82.2 67.4 -80.3C69.8 -78.4 72.1 -76.4 74.1 -74.1C76.2 -71.9 78.1 -69.5 79.9 -67.0C81.6 -64.5 83.1 -61.8 84.4 -59.1C85.8 -56.4 86.9 -53.6 88.0 -50.8C89.1 -48.0 89.9 -45.2 90.8 -42.4C91.7 -39.5 92.5 -36.7 93.3 -34.0C94.1 -31.2 94.9 -28.4 95.7 -25.6C96.4 -22.8 97.2 -20.1 97.8 -17.2C98.5 -14.4 99.1 -11.6 99.5 -8.7C100.0 -5.8 100.3 -2.9 100.4 0.0Z"/>
    <clipPath id="shell-mask"><use href="#outline"/></clipPath>
    <g id="eyes" fill="#3a2a22">
      <ellipse cx="-26" cy="-4" rx="8.5" ry="11"/>
      <ellipse cx="26" cy="-4" rx="8.5" ry="11"/>
    </g>
    <g id="glints" fill="#ffffff"><circle cx="-28.5" cy="-8.5" r="3.4"/><circle cx="23.5" cy="-8.5" r="3.4"/></g>
    <path id="eye-happy" d="M-10 4C-10.5-7-6-15 0-15 6-15 10.5-7 10 4 4-1-4-1-10 4Z" fill="#3a2a22"/>
    <path id="eye-angry" d="M-10-7L10 1C10 8 6 12 0 12-6 12-10 8-10 0Z" fill="#3a2a22"/>
    <g id="cheeks" fill="#f28aa3" opacity=".9">
      <ellipse cx="-44" cy="13" rx="9" ry="5"/>
      <ellipse cx="44" cy="13" rx="9" ry="5"/>
    </g>
  </defs>

  <!-- 껍데기: 회전하는 유일한 셀. 원점 = 공 중심 (135,135). -->
  <g id="shell" transform="translate(135 135)">
    <use href="#outline" fill="url(#shell-fill)"/>
    <g clip-path="url(#shell-mask)" stroke-linejoin="round">
      <g fill="none" stroke-linecap="round">
        <path d="M48 -76Q65 -67 76 -51Q82 -32 86 -14Q90 5 90 25Q80 42 67 56 M33 -73Q19 -81 4 -81Q-10 -77 -24 -74Q-38 -71 -52 -64Q-62 -53 -67 -39 M-23 85Q-39 82 -53 72Q-63 59 -72 46Q-82 33 -89 18Q-89 1 -84 -15 M58 -49Q64 -45 66 -39Q67 -32 69 -27Q73 -21 76 -16Q76 -9 74 -3" stroke="#6b3a1d" stroke-width="6.5" opacity=".9"/>
        <path d="M62 -56Q76 -42 82 -24Q82 -4 80 14Q78 33 70 51Q56 64 38 72 M28 -87Q11 -93 -6 -92Q-23 -86 -39 -79Q-55 -73 -70 -63Q-79 -47 -83 -30 M-41 71Q-50 68 -56 61Q-61 53 -66 46Q-72 40 -78 32Q-79 23 -79 14 M46 80Q39 84 32 87Q24 88 16 90Q8 92 0 93Q-8 92 -16 90" stroke="#ebbb82" stroke-width="6.5"/>
      </g>
      <g transform="translate(56 -67) rotate(-40)">
        <path d="M0-3L0-16M0-3L-12 7M0-3L12 7" stroke="#6b3a1d" stroke-width="4" stroke-linecap="round"/>
        <g fill="#3a2216"><ellipse cx="-10" cy="-9" rx="7" ry="6"/><ellipse cx="10" cy="-9" rx="7" ry="6"/><ellipse cx="0" cy="9" rx="7" ry="6"/></g>
      </g>
      <g transform="rotate(130)">
        <path d="M66-80L72-62 66-46 74-30 67-14 75 2 68 18 75 34 67 50 73 66 66 84L130 84 130-80Z" fill="#3b2318"/>
        <path d="M75-74L80-60 74-46 81-30 75-14 82 2 75 18 82 34 75 50 80 66 75 80L130 80 130-74Z" fill="#fbf7ec"/>
        <ellipse cx="104" cy="2" rx="16" ry="58" fill="#efe5cb"/>
        <path d="M84-40Q80 2 85 42" fill="none" stroke="#ffffff" stroke-width="5" stroke-linecap="round"/>
      </g>
    </g>
    <path d="M64-88q2-10 9-14M76-78q7-6 15-6" fill="none" stroke="#4b3022" stroke-width="4" stroke-linecap="round"/>
    <use href="#outline" fill="none" stroke="#4b3022" stroke-width="5.5" stroke-linejoin="round"/>
  </g>

  <!-- 빛·그늘 덧칠: 돌지 않는다(호두와 같은 자리, 갈색 계열). 원점 = (380,120). -->
  <g id="shade" transform="translate(380 120)">
    <circle r="97.5" fill="url(#shade-fill)"/>
    <ellipse cx="-46" cy="-50" rx="24" ry="12" transform="rotate(-38 -46 -50)" fill="#fff3e0" opacity=".28"/>
    <path d="M78 42A88 88 0 0 1 30 84" fill="none" stroke="#d9a070" stroke-width="5" stroke-linecap="round" opacity=".55"/>
  </g>

  <!-- 최고 속도 회전 호 (진행 +x, 시계 방향). 원점 = (640,150). -->
  <g id="spin-arcs" transform="translate(640 150)" fill="none" stroke-linecap="round">
    <path d="M-112-38A118 118 0 0 1-38-112" stroke="#4b3022" stroke-width="11" opacity=".3"/>
    <path d="M-112-38A118 118 0 0 1-38-112" stroke="#ffffff" stroke-width="7"/>
    <path d="M112 38A118 118 0 0 1 52 105" stroke="#ffffff" stroke-width="6" opacity=".85"/>
  </g>

  <!-- 돌지 않는 얼굴 5종 (160x80, 중심 = 셀 중심). 쌀·찹쌀과 같은 점눈 + 흰 하이라이트, 분홍 볼. -->
  <g id="face-neutral" transform="translate(90 340)">
    <use href="#cheeks"/><use href="#eyes"/><use href="#glints"/>
    <path d="M-7 14Q0 20 7 14" fill="none" stroke="#3a2a22" stroke-width="3.5" stroke-linecap="round"/>
  </g>
  <g id="face-happy" transform="translate(260 340)">
    <use href="#cheeks"/>
    <use href="#eye-happy" x="-26" y="-2"/><use href="#eye-happy" x="26" y="-2"/>
    <path d="M-12 9Q0 30 12 9Q0 14-12 9Z" fill="#7a2f22" stroke="#3a2a22" stroke-width="3" stroke-linejoin="round"/>
    <ellipse cx="0" cy="18" rx="5" ry="3" fill="#ff8f86"/>
  </g>
  <g id="face-rush" transform="translate(430 340)">
    <use href="#cheeks"/>
    <path d="M-35 0Q-26-13-17 0M17 0Q26-13 35 0" fill="none" stroke="#3a2a22" stroke-width="5" stroke-linecap="round"/>
    <path d="M-15 6Q0 38 15 6Q0 11-15 6Z" fill="#7a2f22" stroke="#3a2a22" stroke-width="3" stroke-linejoin="round"/>
    <ellipse cx="0" cy="22" rx="6" ry="3.5" fill="#ff8f86"/>
  </g>
  <g id="face-bump" transform="translate(600 340)">
    <use href="#cheeks"/><use href="#eyes"/><use href="#glints"/>
    <path d="M-40-25L-15-15M40-25L15-15" fill="none" stroke="#3a2a22" stroke-width="5" stroke-linecap="round"/>
    <path d="M-10 13Q0 6 10 13 9 25 0 25-9 25-10 13Z" fill="#3a2a22"/>
    <path d="M-5 22Q0 18 5 22" fill="#f28aa3"/>
  </g>
  <g id="face-hurt" transform="translate(770 340)">
    <use href="#cheeks"/>
    <path d="M-37-14L-18-4-37 6M37-14L18-4 37 6" fill="none" stroke="#3a2a22" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M-8 18q4-7 8 0t8 0" fill="none" stroke="#3a2a22" stroke-width="3" stroke-linecap="round"/>
  </g>

  <!-- 중간 속도 바람줄 2가닥. 원점 = 공 중심 (340,510). -->
  <g id="streaks-mid" transform="translate(340 510)" fill="#ffffff">
    <path d="M-114-30Q-110-36-104-30L-220-27Q-226-30-220-33Z"/>
    <path d="M-110 30Q-106 25-100 30L-190 32Q-195 29-190 26Z" opacity=".85"/>
  </g>
  <!-- 최고 속도: 옅은 바람 원뿔 + 바람줄 3가닥. 공 뒤로 지름 1배 안팎. 원점 = 공 중심 (880,510). -->
  <g id="streaks-max" transform="translate(880 510)" fill="#ffffff">
    <path d="M-92-80L-300-34-300 38-92 82Z" opacity=".14"/>
    <path d="M-116-42Q-112-49-104-42L-280-36Q-288-40-280-44Z"/>
    <path d="M-120 4Q-116-4-107 4L-310 6Q-318 2-310-2Z"/>
    <path d="M-114 48Q-110 41-102 48L-250 50Q-257 46-250 42Z" opacity=".85"/>
  </g>

  <!-- 느린 흙먼지 2알. 원점 = 땅 접점 (200,690). -->
  <g id="dust-slow" transform="translate(200 690)" fill="#efe2c4" stroke="#a38a62" stroke-width="3.5">
    <circle cx="-66" cy="-10" r="9"/>
    <circle cx="-36" cy="-14" r="14"/>
  </g>
  <!-- 최고 속도 흙먼지 4알 + 흙알 2. 원점 = 땅 접점 (540,770). -->
  <g id="dust-max" transform="translate(540 770)">
    <g fill="#efe2c4" stroke="#a38a62" stroke-width="3.5">
      <circle cx="-170" cy="-16" r="13"/>
      <circle cx="-124" cy="-26" r="22"/>
      <circle cx="-74" cy="-30" r="26"/>
      <circle cx="-30" cy="-18" r="19"/>
    </g>
    <path d="M-86-44q8-10 20-10" fill="none" stroke="#ffffff" stroke-width="4" stroke-linecap="round"/>
    <g fill="#7a6446"><circle cx="-56" cy="-92" r="6"/><circle cx="-112" cy="-78" r="4.5"/></g>
  </g>

  <!-- 충돌: 별 모양 충격. 원점 = 부딪힌 점 (670,720). -->
  <g id="impact" transform="translate(670 720)">
    <path d="M0-82L14-38 58-62 34-22 92-16 38 4 66 46 20 26 10 76-6 30-44 64-30 18-90 10-38-12-70-52-22-36Z" fill="#ffd95a" stroke="#2b1a10" stroke-width="4.5" stroke-linejoin="round"/>
    <path d="M0-52L8-24 34-38 20-12 54-8 22 4 38 28 12 16 6 44-4 18-26 38-18 10-52 6-22-8-40-30-12-20Z" fill="#fffbe6"/>
  </g>
</svg>
