<svg xmlns="http://www.w3.org/2000/svg" width="560" height="262" viewBox="0 0 560 262">
  <!--
    참깨 파츠 시트 3차 시안 SB2 같은 외곽, 꼭지를 오른쪽으로 살짝 기울임 (쌀 계열, 찹쌀·목화솜 parts.svg 형식). 셀 좌표는 [x, y, w, h] / 회전 중심 [px, py] (셀 왼쪽 위 기준).
      body     [10, 10, 180, 190] / [90, 190]
      tool     [370, 4, 64, 100] / [32, 80]
      foot     [444, 12, 52, 40] / [26, 14]
      arm      [504, 8, 48, 60] / [20, 10]
      neutral  [10, 210, 98, 45] / [49, 22]
      attack   [115, 210, 98, 45] / [49, 22]
      hurt     [220, 210, 98, 45] / [49, 22]
    body·cap의 회전 중심 = 땅(두 발 사이 가운데). 서 있는 모습(땅 원점 기준):
      발 [(-21, -12), (21, -12)] (왼발은 좌우 반전), 몸 (0,0), 얼굴 (0, -62) 0.72배,
      팔(손목) [(-54, -56), (54, -56)] 회전 ±8도 · 0.8배 (왼팔 좌우 반전),
      도구(tool) (60, -42) 회전 14도 (오른팔보다 먼저 그림).
    그리는 순서: 발 → 몸 → 얼굴 → 도구 → 팔. 외곽선 #4b3022 5(몸)·4(팔다리). 실물 사진(위키미디어 공용 sesame seeds / buckwheat grain 맨 위 왼쪽 사진)의 외곽·색을 따름.
  -->
  <defs>
    <linearGradient id="sb2-limb" x1=".2" y1="0" x2=".7" y2="1">
      <stop stop-color="#f6f5e2"/><stop offset=".6" stop-color="#ebe9cc"/><stop offset="1" stop-color="#d3d0a8"/>
    </linearGradient>
    <path id="sb2-body-outline" d="M14 -154C28 -152 38 -144 42 -128C50 -106 58 -92 58 -62C58 -30 34 -12 0 -12C-34 -12 -58 -30 -58 -62C-58 -92 -44 -110 -30 -130C-18 -148 0 -156 14 -154Z"/>
    <clipPath id="sb2-body-mask"><use href="#sb2-body-outline"/></clipPath>
    <g id="sb2-eyes">
      <ellipse cx="24" cy="20" rx="7.5" ry="9.5"/>
      <ellipse cx="74" cy="20" rx="7.5" ry="9.5"/>
      <g fill="#ffffff"><circle cx="22" cy="16" r="3"/><circle cx="72" cy="16" r="3"/></g>
    </g>
    <g id="sb2-cheeks" fill="#f6a0a0" opacity=".9">
      <ellipse cx="9" cy="32" rx="7" ry="4"/><ellipse cx="89" cy="32" rx="7" ry="4"/>
    </g>
  </defs>

  <!-- 몸: 흰 참깨(사진 기준). 아주 납작한 씨라 입체 음영 없이 평평한 녹색기 아이보리 한 색 + 가장자리 안쪽을 한 바퀴 도는 얇은 테두리 띠 + 작은 흰 결 하나, 균일한 진갈색 외곽선. -->
  <g id="body" transform="translate(100 200)">
    <use href="#sb2-body-outline" fill="#ebe9cc"/>
    <g clip-path="url(#sb2-body-mask)">
      <use href="#sb2-body-outline" fill="none" stroke="#d9d6b0" stroke-width="22" stroke-linejoin="round"/>
    </g>
    <path d="M-34 -84q4-16 14-28" fill="none" stroke="#ffffff" stroke-width="5" stroke-linecap="round" opacity=".8"/>
    <use href="#sb2-body-outline" fill="none" stroke="#4b3022" stroke-width="5" stroke-linejoin="round"/>
  </g>

  <!-- 도구: 작은 망치(손잡이 아래쪽 끝이 손, 회전 중심 = 쥔 자리). -->
  <g id="tool" transform="translate(402 84)">
    <path d="M-3.5 12V-44h7V12Z" fill="#b57a45" stroke="#4b3022" stroke-width="3.5" stroke-linejoin="round"/>
    <path d="M-17 -60h30q4 0 4 4v12q0 4-4 4h-30q-3 0-3-4v-12q0-4 3-4Z" fill="#b8bec8" stroke="#4b3022" stroke-width="4" stroke-linejoin="round"/>
    <path d="M-14 -55h22" stroke="#eef1f5" stroke-width="3" stroke-linecap="round"/>
  </g>

  <g id="foot" transform="translate(444 12)">
    <path d="M9 7q17-6 34 0 5 13 3 22-1 6-7 7H13q-6-1-7-7-2-9 3-22Z" fill="url(#sb2-limb)" stroke="#4b3022" stroke-width="4" stroke-linejoin="round"/>
    <path d="M14 11q8-3 16-2" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" opacity=".9"/>
  </g>
  <g id="arm" transform="translate(504 8)">
    <path d="M12 7c10-6 22-2 27 9 5 12 4 26-3 33-8 7-20 6-26-3-6-9-7-20-6-28 1-5 4-9 8-11Z" fill="url(#sb2-limb)" stroke="#4b3022" stroke-width="4" stroke-linejoin="round"/>
    <path d="M14 13q6-3 12 1" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" opacity=".9"/>
  </g>

  <!-- 얼굴: 찹쌀·목화솜 얼굴 셀 그대로(점눈 + 흰 하이라이트 한 점, 넓은 눈 간격, 분홍 볼, 작은 입). -->
  <g id="neutral" transform="translate(10 210)" fill="#3a2a22">
    <use href="#sb2-eyes"/><use href="#sb2-cheeks"/>
    <path d="M43 30q6 6 12 0" fill="none" stroke="#3a2a22" stroke-width="3" stroke-linecap="round"/>
  </g>
  <g id="attack" transform="translate(115 210)" fill="#3a2a22">
    <use href="#sb2-eyes"/><use href="#sb2-cheeks"/>
    <path d="m14 8 17 6m37 0 17-6" fill="none" stroke="#3a2a22" stroke-width="4" stroke-linecap="round"/>
    <path d="M40 29q9-6 18 0-1 11-9 11t-9-11Z"/>
    <path d="M44 37q5-4 10 0" fill="#f28aa3"/>
  </g>
  <g id="hurt" transform="translate(220 210)">
    <use href="#sb2-cheeks"/>
    <path d="m14 13 18 7-18 7m70-14-18 7 18 7" fill="none" stroke="#3a2a22" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M38 36q3-4 6 0t6 0 6 0 6 0" fill="none" stroke="#3a2a22" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
