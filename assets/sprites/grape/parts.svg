    <path d="M27 142c3-10 13-16 21-18 3-1 5 1 4 4-2 5-9 5-16 12-5 6-10 6-9 2Z"/>
    <path d="M181 121c10 4 18 13 19 23 1 5-4 6-6 1-3-8-8-13-14-17-4-3-3-8 1-7Z"/>
  </g>

