      <stop offset=".37" stop-color="#9c65cb"/>
      <stop offset=".73" stop-color="#783fa0"/>
      <stop offset="1" stop-color="#522968"/>
    </radialGradient>
    <radialGradient id="grape-back" cx="38%" cy="26%" r="82%">
      <stop stop-color="#a174cb"/>
      <stop offset=".62" stop-color="#744699"/>
      <stop offset="1" stop-color="#482653"/>
    </radialGradient>
    <linearGradient id="leaf" x2=".85" y2="1">
