      <ellipse cx="76" cy="20" rx="8.6" ry="11.5"/>
      <g fill="#fff6df">
        <ellipse cx="24" cy="16" rx="3" ry="3.7"/>
        <ellipse cx="74" cy="16" rx="3" ry="3.7"/>
