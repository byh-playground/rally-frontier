    <path d="M110 36c12-15 27-20 41-20l-2 8 15-2-3 9 14 3-9 8 9 5c-15 15-35 20-57 10l-13-10Z" fill="url(#leaf)" stroke="#435234"/>
    <path d="M111 48q20-15 49-11m-25 4 11 8" fill="none" stroke="#547c44" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M116 235c-25 0-43-17-43-41 0-24 19-43 43-43 26 0 46 18 46 42 0 26-18 42-46 42Z" fill="url(#grape-back)"/>
    <path d="M67 55c25 0 44 17 44 42 0 26-19 46-47 46-26 0-45-18-44-42 1-27 21-46 47-46Z" fill="url(#grape-back)"/>
    <path d="M151 55c29-1 51 18 52 43 1 27-18 46-46 47-27 1-48-18-48-43 0-26 17-46 42-47Z" fill="url(#grape-back)"/>
    <path d="M62 108c29-1 49 18 49 47 0 28-20 47-47 48-28 0-51-19-51-46 0-29 20-49 49-49Z" fill="url(#grape)"/>
    <path d="M166 107c27 0 45 21 45 47 1 28-18 48-47 49-27 1-48-19-48-46 0-29 22-50 50-50Z" fill="url(#grape)"/>
    <path d="M111 71c38-2 65 25 66 61 2 38-26 68-64 69-40 1-68-26-68-63 0-37 28-65 66-67Z" fill="url(#grape)"/>
  </g>
