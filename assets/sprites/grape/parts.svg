  <g id="berry-part" transform="translate(340 80)">
    <path d="M28 5c15 0 25 10 25 24S42 53 28 53 4 44 4 30C4 15 14 5 28 5Z" fill="url(#grape)" stroke="#412447" stroke-width="4"/>
    <path d="M11 23c2-6 10-11 17-11 4 0 7 2 4 4-3 2-8 1-14 7-3 3-8 3-7 0Z" fill="#f4d2ff" opacity=".7"/>
    <path d="m25 6 6 5 4-5" fill="#91b668" stroke="#435234" stroke-width="2.5" stroke-linejoin="round"/>
