      발 [(-24, -12), (24, -12)] (왼발은 좌우 반전), 몸 (0,0), 머리 장식(cap) (0,0), 얼굴 (0, -88),
      팔(손목) [(-80, -64), (80, -64)] 회전 ±8도 · 0.85배 (왼팔 좌우 반전).
    그리는 순서: 발 → 몸 → 머리 장식 → 얼굴 → 팔. 키(꼭지 끝~땅) 약 203.4 단위.
    몸·머리 외곽은 주인 참고 그림(ref/user-reference.jpg)의 윤곽선을 따라 만든 경로.
