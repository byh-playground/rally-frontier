  <!--
    목화솜 파츠 시트 시안 G1 (쌀 계열, 찹쌀 parts.svg 형식). 셀 좌표는 [x, y, w, h] / 회전 중심 [px, py] (셀 왼쪽 위 기준).
      body     [10, 10, 196, 160] / [98, 172]
      cap      [216, 6, 170, 118] / [80, 214]
      foot     [396, 12, 52, 40] / [26, 14]
      arm      [456, 8, 48, 60] / [20, 10]
      neutral  [10, 182, 98, 45] / [49, 22]
      attack   [115, 182, 98, 45] / [49, 22]
