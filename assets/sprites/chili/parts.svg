      <path d="M-39.2 16 -29.4-12M0 22V-14M39.2 16 29.4-12" stroke="#2f5a1c" stroke-width="3.5" stroke-linecap="round" opacity=".55"/></g></g>
  </g>
  <g id="chili-muzzle" transform="translate(302 295)">
      <path d="M-4 0C6-30 52-40 126-8 98 0 104 4 126 10 52 40 6 30-4 0Z" fill="#e8401c" stroke="#8a1c0c" stroke-width="5" stroke-linejoin="round"/>
      <path d="M2 0C12-18 46-24 96-4 80 2 82 4 94 8 46 22 12 18 2 0Z" fill="#ff9a1f"/>
      <path d="M6 0C14-9 32-11 58 0 32 11 14 9 6 0Z" fill="#ffe36b"/>
  </g>
  <g id="chili-foot" transform="translate(476 281)">
      <path d="M-20-25Q0-30 20-25C25-9 25 13 13 23 6 30-7 30-14 22-25 10-26-9-20-25Z" fill="url(#chili-limb)" stroke="#3b2a1e" stroke-width="6.5" stroke-linejoin="round"/>
      <path d="M-11-12Q-14-3-11 6" fill="none" stroke="#ffe0d0" stroke-width="4.5" stroke-linecap="round" opacity=".7"/>
