        <path d="M-183.2 -105.1L-164.7 -106.1L-146.1 -107.2L-127.4 -108.1L-108.6 -109L-89.8 -109.7L-70.8 -110.2L-51.7 -110.6L-32.5 -110.9L-13.2 -111L6.4 -110.9L26.1 -110.6L46 -110.1L66 -109.5L86.3 -108.7L106.8 -107.8L127.5 -106.7L148.5 -105.5L169.8 -104.2L191.4 -103.1L213.7 -103" fill="none" stroke="#7a0c10" stroke-width="98" opacity=".35" stroke-linecap="round"/>
