  <g id="chili-cap" transform="translate(182 379)">
      <g transform="rotate(-92.9)"><path d="M0-50C2-92 40-104 86-136" fill="none" stroke="#3b2a1e" stroke-width="22" stroke-linecap="round"/>
      <path d="M0-50C2-92 40-104 86-136" fill="none" stroke="#5f9a33" stroke-width="13" stroke-linecap="round"/>
      <g transform="scale(.74 .6)"><g fill="url(#chili-leaf)" stroke="#3b2a1e" stroke-width="7.5" stroke-linejoin="round"><path d="M-106 8C-108-40 -49-108 0-110S108-40 106 8L96 44 60.76 18 37.24 50 13.72 20-11.76 52-37.24 20-60.76 46-78.4 16-98 40Z"/></g>
