<svg xmlns="http://www.w3.org/2000/svg" width="440" height="248" viewBox="0 0 440 248">
  <title>Banana hero sprite parts</title>
  <defs>
    <linearGradient id="peel" x1="15%" y1="18%" x2="88%" y2="88%">
      <stop stop-color="#fff18a"/>
      <stop offset=".5" stop-color="#ffd54e"/>
      <stop offset="1" stop-color="#e99a26"/>
    </linearGradient>
    <linearGradient id="limb" x2=".65" y2="1">
      <stop stop-color="#ffe774"/>
      <stop offset="1" stop-color="#d8932a"/>
    </linearGradient>
    <path id="peel-shape" d="M131 23c-25 15-49 38-65 68-18 34-24 70-14 98 9 25 29 40 54 42 24 2 45-8 59-23 8-9 13-18 15-27 2-7-3-11-9-7-13 9-25 11-36 6-16-8-23-30-21-58 2-28 12-54 29-78Z"/>
    <clipPath id="peel-clip"><use href="#peel-shape"/></clipPath>
    <g id="eyes">
      <ellipse cx="19" cy="21" rx="7.7" ry="11"/>
      <ellipse cx="43" cy="21" rx="7.7" ry="11"/>
      <g fill="#fff7d6">
        <ellipse cx="20" cy="17" rx="2.6" ry="3.5"/>
        <ellipse cx="44" cy="17" rx="2.6" ry="3.5"/>
      </g>
    </g>
    <g id="cheeks" fill="#e58553">
      <ellipse cx="10" cy="32" rx="5" ry="3"/>
      <ellipse cx="51" cy="32" rx="5" ry="3"/>
    </g>
  </defs>

  <!-- Body, with both ends kept inside the same silhouette. -->
  <g id="body" transform="translate(2 2)" stroke-linecap="round" stroke-linejoin="round">
    <use href="#peel-shape" fill="url(#peel)"/>
    <g clip-path="url(#peel-clip)">
      <path d="M45 146c2 38 24 63 56 68 33 5 59-10 81-44l13 41-41 34-68 5-39-31-15-44Z" fill="#c47d24" opacity=".45"/>
      <path d="M119 45c-23 19-42 42-52 66" fill="none" stroke="#fff5af" stroke-width="9" opacity=".8"/>
      <path d="M60 181c10 23 28 34 52 35" fill="none" stroke="#fff0a0" stroke-width="4.5" opacity=".65"/>
      <path d="M176 151c-4 7-2 13 6 17l10-8-7-13Z" fill="#80512f"/>
    </g>
    <use href="#peel-shape" fill="none" stroke="#583b25" stroke-width="5.5"/>
    <path d="M126 29c6-8 5-15 7-23 7-2 13-1 20 4-3 7-4 12-2 19l-10 15c-5-6-10-9-15-15Z" fill="#92a947" stroke="#583b25" stroke-width="5"/>
    <path d="M136 10c4-2 9-1 13 2" fill="none" stroke="#d5d878" stroke-width="3.5"/>
  </g>

  <g id="arm" transform="translate(230 2)" stroke-linecap="round" stroke-linejoin="round">
    <path d="M9 23c2-8 11-13 22-13 10 0 16 5 15 13-1 10-10 15-21 15-9 0-18-5-16-15Z" fill="url(#limb)" stroke="#583b25" stroke-width="4.5"/>
    <path d="M16 20c3-3 8-5 13-5" fill="none" stroke="#fff1a2" stroke-width="3"/>
  </g>
  <g id="boot" transform="translate(306 2)" stroke-linecap="round" stroke-linejoin="round">
    <path d="M10 13c4-5 13-6 23-4 9 2 13 8 12 16-1 10-10 17-22 16C11 40 6 34 6 26c0-5 1-10 4-13Z" fill="url(#limb)" stroke="#583b25" stroke-width="4.5"/>
    <path d="M13 18c2-3 6-4 10-4" fill="none" stroke="#fff1a2" stroke-width="3"/>
  </g>

  <g id="face-neutral" transform="translate(230 66)" fill="#3a261c">
    <use href="#cheeks"/>
    <use href="#eyes"/>
    <path d="M24 34q8 9 15-1" fill="none" stroke="#3a261c" stroke-width="3.5" stroke-linecap="round"/>
  </g>
  <g id="face-attack" transform="translate(298 66)" fill="#3a261c">
    <use href="#cheeks"/>
    <use href="#eyes"/>
    <path d="m11 9 14 5m11 0 15-6" fill="none" stroke="#3a261c" stroke-width="4.2" stroke-linecap="round"/>
    <path d="M23 34q7-5 17-2-3 12-10 11-6-1-7-9Z"/>
    <path d="M28 34q4-1 8-1" fill="none" stroke="#fff7d6" stroke-width="2.4" stroke-linecap="round"/>
  </g>
  <g id="face-hurt" transform="translate(366 66)" fill="#3a261c">
    <use href="#cheeks"/>
    <path d="m12 15 13 7-12 6m37-13-13 7 12 6" fill="none" stroke="#3a261c" stroke-width="4.4" stroke-linecap="round" stroke-linejoin="round"/>
    <ellipse cx="31" cy="37" rx="5" ry="6"/>
  </g>

  <!-- A whole banana, shared between the hand and the returning projectile. -->
  <g id="boomerang" transform="translate(230 120)" stroke-linecap="round" stroke-linejoin="round">
    <path d="M77 19c1-6 3-11 7-15l10 3-3 13-7 8Z" fill="#679340" stroke="#583b25" stroke-width="4.5"/>
    <path d="M81 17c6-2 12 3 12 9 0 24-10 47-29 60-15 10-35 15-50 7-5-2-7-6-5-11 2-4 5-6 11-6 15 1 30-6 40-17 8-9 13-21 15-33 1-5 2-8 6-9Z" fill="url(#peel)" stroke="#583b25" stroke-width="5"/>
    <path d="M16 87c16 4 32 1 47-10 14-11 22-26 26-43-1 21-11 41-25 51-14 10-33 14-46 8Z" fill="#d38425"/>
    <path d="M78 34c-3 13-10 26-19 33-8 7-17 12-26 14" fill="none" stroke="#fff5b2" stroke-width="4.5"/>
    <path d="M12 81c-4 4-2 10 3 12l7 1-1-8-4-7Z" fill="#80512f"/>
  </g>
</svg>
