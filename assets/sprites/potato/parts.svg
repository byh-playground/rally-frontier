  </g>
  <g id="vine" transform="translate(566 4)">
    <path d="M40 170c6-30 0-60-12-90-8-20-8-40 4-58 6-8 16-6 14 4-10 18-8 34 0 52 12 28 18 60 10 92Z" fill="#7a9a3e" stroke="#4b3022" stroke-width="4" stroke-linejoin="round"/>
    <path d="M60 170c-4-34 6-62 18-88 8-18 8-34-2-50-4-8 4-14 10-6 12 18 12 38 4 58-10 26-18 52-14 86Z" fill="#668834" stroke="#4b3022" stroke-width="4" stroke-linejoin="round"/>
