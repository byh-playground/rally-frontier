    <path d="M42 31q7 7 14 0" fill="none" stroke="#352519" stroke-width="3.2" stroke-linecap="round"/>
  </g>
  <g id="attack" transform="translate(115 206)" fill="#352519">
    <use href="#eyes"/><use href="#cheeks"/>
    <path d="m13 8 18 6m36 0 18-6" fill="none" stroke="#352519" stroke-width="4.5" stroke-linecap="round"/>
    <path d="M39 28h20q2 5 0 10H39q-2-5 0-10Z" fill="#fff6dc" stroke="#352519" stroke-width="3" stroke-linejoin="round"/>
    <path d="M49 28v10" stroke="#352519" stroke-width="2"/>
  </g>
  <g id="hurt" transform="translate(220 206)">
    <use href="#cheeks"/>
    <path d="m14 14 18 7-18 7m70-14-18 7 18 7" fill="none" stroke="#352519" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <ellipse cx="49" cy="35" rx="5" ry="6" fill="#352519"/>
  </g>
  <g id="effort" transform="translate(325 206)">
    <use href="#cheeks"/>
    <path d="M14 18q10 8 20 0M64 18q10 8 20 0" fill="none" stroke="#352519" stroke-width="4.5" stroke-linecap="round"/>
    <path d="M43 32q6-3 12 0" fill="none" stroke="#352519" stroke-width="3.5" stroke-linecap="round"/>
    <path d="M90 2q4 7 4 10a4 4 0 0 1-8 0q0-3 4-10Z" fill="#9fd4f0" stroke="#4b3022" stroke-width="2"/>
