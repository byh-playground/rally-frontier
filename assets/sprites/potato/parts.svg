<svg xmlns="http://www.w3.org/2000/svg" width="680" height="360" viewBox="0 0 680 360">
  <!--
    감자 파츠 시트 시안 v2. 셀 좌표는 [x, y, w, h] / 회전 중심 [px, py].
    body [10,10,196,186] / [98,178]        foot [215,12,56,42] / [28,14]
    arm [278,8,50,60] / [24,10]            shovel [334,4,60,156] / [30,62]
    sprout [400,6,74,72] / [32,66]         vine [566,4,104,176] / [52,170]
    bud [478,8,84,84] / [20,42] (v2: 꽃처럼 보이던 crack 대신 완성형 포구와 같은 짧은 포신 싹)
    neutral [10,206,98,45] / [49,22]       attack [115,206,98,45] / [49,22]
    hurt [220,206,98,45] / [49,22]         effort [325,206,98,45] / [49,22]
    mound-back [10,262,224,90] / [112,70]  mound-front [242,276,224,76] / [112,40]
    launch-ammo [474,186,124,106] / [62,60]
    전진 대포 완성형은 거점 대포와 같은 벡터 자산 구조라서 assets/units/forward-cannon.svg에 둔다.
  -->
  <defs>
    <radialGradient id="skin" cx="36%" cy="28%" r="80%">
      <stop stop-color="#f7e3b0"/>
      <stop offset=".38" stop-color="#d6a865"/>
      <stop offset=".78" stop-color="#9a6a3a"/>
      <stop offset="1" stop-color="#734b28"/>
    </radialGradient>
    <linearGradient id="limb" x1=".2" y1="0" x2=".7" y2="1">
      <stop stop-color="#efd39a"/>
      <stop offset=".6" stop-color="#c3935a"/>
      <stop offset="1" stop-color="#86592f"/>
    </linearGradient>
    <linearGradient id="steel" x1=".1" y1="0" x2=".9" y2="1">
      <stop stop-color="#ffffff"/>
      <stop offset=".5" stop-color="#d3e1e4"/>
      <stop offset="1" stop-color="#93a8ae"/>
    </linearGradient>
    <linearGradient id="soil" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#b48659"/>
      <stop offset=".55" stop-color="#946a43"/>
      <stop offset="1" stop-color="#6f4d30"/>
    </linearGradient>
    <path id="body-outline" d="M44 34C58 18 84 10 112 12c24 1 46 10 60 28 12 14 16 30 14 46-1 10-5 16-2 26 4 20-2 40-18 52-18 14-50 18-78 16-28-2-54-10-68-28-12-16-14-34-10-50 2-10-2-18 2-30 4-16 16-28 32-38Z"/>
    <clipPath id="body-mask"><use href="#body-outline"/></clipPath>
    <path id="ammo-outline" d="M22 30c14-14 40-20 64-16 22 4 36 18 34 36-1 8-4 12-2 20-2 14-20 22-44 22-26 0-50-6-62-20-8-10-6-22-2-28-2-6 2-10 12-14Z"/>
    <clipPath id="ammo-mask"><use href="#ammo-outline"/></clipPath>
    <g id="eyes">
      <ellipse cx="24" cy="21" rx="7.5" ry="9.5"/>
      <ellipse cx="74" cy="21" rx="7.5" ry="9.5"/>
      <g fill="#fff4d6"><circle cx="22" cy="17" r="3"/><circle cx="72" cy="17" r="3"/></g>
    </g>
    <g id="cheeks" fill="#de7f62" opacity=".85">
      <ellipse cx="9" cy="33" rx="7" ry="3.8"/>
      <ellipse cx="89" cy="33" rx="7" ry="3.8"/>
    </g>
    <g id="speckles" fill="#7f5c3a">
      <circle cx="0" cy="0" r="2.4"/><circle cx="7" cy="5" r="1.5"/><circle cx="-5" cy="7" r="1.7"/>
    </g>
  </defs>

  <!-- 몸통: 울퉁불퉁한 감자, 반점과 눈(움푹한 초승달), 흙 얼룩. 싹은 따로 움직인다. -->
  <g id="body" transform="translate(10 10)">
    <use href="#body-outline" fill="url(#skin)"/>
    <g clip-path="url(#body-mask)">
      <path d="M0 130q98 70 196 0v60H0Z" fill="#7a5634" opacity=".38"/>
      <path d="M14 150q26 22 66 26-8 6-30 2-26-6-36-28Z" fill="#6b4a2c" opacity=".35"/>
      <use href="#speckles" transform="translate(150 92)"/>
      <use href="#speckles" transform="translate(66 120) rotate(70)"/>
      <use href="#speckles" transform="translate(120 152) rotate(140)"/>
      <use href="#speckles" transform="translate(36 70) rotate(200)"/>
      <use href="#speckles" transform="translate(164 132) rotate(30) scale(.8)"/>
      <use href="#speckles" transform="translate(96 40) rotate(250) scale(.8)"/>
      <g fill="#fbebc3" opacity=".7">
        <circle cx="130" cy="36" r="2.5"/><circle cx="58" cy="100" r="2"/><circle cx="142" cy="112" r="2.2"/>
      </g>
      <g fill="#6f4c2e">
        <ellipse cx="48" cy="108" rx="4" ry="2.2" transform="rotate(-14 48 108)"/>
        <ellipse cx="150" cy="60" rx="4" ry="2.2" transform="rotate(12 150 60)"/>
        <ellipse cx="134" cy="162" rx="3.6" ry="2" transform="rotate(-6 134 162)"/>
        <ellipse cx="34" cy="142" rx="3.4" ry="2" transform="rotate(-34 34 142)"/>
        <ellipse cx="168" cy="114" rx="3.4" ry="2" transform="rotate(24 168 114)"/>
      </g>
      <g fill="none" stroke="#f6e2b0" stroke-width="1.8" stroke-linecap="round" opacity=".9">
        <path d="M44 113q5 1 9-1M146 65q5 1 9-1M130 167q4 1 8-1M31 147q4 0 7-3M165 119q4 0 7-3"/>
      </g>
    </g>
    <path d="M40 66q10-26 40-36" fill="none" stroke="#fff4d2" stroke-width="7" stroke-linecap="round" opacity=".8"/>
    <circle cx="34" cy="82" r="4" fill="#fff4d2" opacity=".85"/>
    <use href="#body-outline" fill="none" stroke="#4b3022" stroke-width="5" stroke-linejoin="round"/>
  </g>

  <g id="foot" transform="translate(215 12)">
    <path d="M10 7q18-6 36 0 5 13 3 22-1 6-7 7H14q-6-1-7-7-2-9 3-22Z" fill="url(#limb)" stroke="#4b3022" stroke-width="4" stroke-linejoin="round"/>
    <path d="M9 27q19 5 38 0" fill="none" stroke="#7a5634" stroke-width="3" opacity=".6"/>
    <path d="M15 11q8-3 16-2" fill="none" stroke="#fff4d2" stroke-width="3" stroke-linecap="round" opacity=".8"/>
  </g>
  <g id="arm" transform="translate(278 8)">
