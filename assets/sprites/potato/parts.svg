    <path d="M14 6h32q6 0 6 6t-6 6H14q-6 0-6-6t6-6Z" fill="#b77a3e" stroke="#4b3022" stroke-width="4"/>
    <path d="M23 17h14v84H23Z" fill="#c98d4c" stroke="#4b3022" stroke-width="4" stroke-linejoin="round"/>
    <path d="M28 22v72" stroke="#efc98a" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M8 102q22-8 44 0v28q0 18-22 26-22-8-22-26Z" fill="url(#steel)" stroke="#4b3022" stroke-width="4" stroke-linejoin="round"/>
    <path d="M20 98h20v10H20Z" fill="#8c9aa0" stroke="#4b3022" stroke-width="3.5" stroke-linejoin="round"/>
    <path d="M15 110q4 22 12 34" fill="none" stroke="#ffffff" stroke-width="4.5" stroke-linecap="round" opacity=".85"/>
    <path d="M14 136q8 8 16 12" fill="none" stroke="#7a5634" stroke-width="4" stroke-linecap="round" opacity=".55"/>
  </g>
  <g id="sprout" transform="translate(400 6)">
