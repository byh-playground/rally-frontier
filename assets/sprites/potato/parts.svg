    <path d="M32 66c-3-14 0-26 6-36" fill="none" stroke="#7fb348" stroke-width="5" stroke-linecap="round"/>
    <path d="M36 36C24 20 8 22 4 30c10 12 24 12 32 6Z" fill="#8cc152" stroke="#4b3022" stroke-width="3.5" stroke-linejoin="round"/>
    <path d="M40 30C46 12 62 6 70 12c-4 16-18 22-30 18Z" fill="#9fd05c" stroke="#4b3022" stroke-width="3.5" stroke-linejoin="round"/>
    <path d="M12 29q12 0 22 5M44 26q10-6 20-12" fill="none" stroke="#5f9a3a" stroke-width="2.5" stroke-linecap="round"/>
  </g>
  <!-- 변신 중간 단계: 감자 껍질을 뚫고 나오는 짧은 포신 싹(덩굴 띠·크림색 테·어두운 구멍이 전진 대포 포구와 같다), 받침이 되는 덩굴. -->
  <g id="bud" transform="translate(498 50)">
    <path d="M-12-20l-6-10 10 4 2-10 6 10M-12 20l-6 10 10-4 2 10 6-10" fill="#c9a26a" stroke="#4b3022" stroke-width="3" stroke-linejoin="round"/>
    <path d="M-8-26C10-31 30-31 46-28V28C30 31 10 31-8 26-12 10-12-10-8-26Z" fill="#cfa86f" stroke="#4b3022" stroke-width="4" stroke-linejoin="round"/>
