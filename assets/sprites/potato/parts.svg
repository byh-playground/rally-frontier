    <path d="M26 40q10-14 30-18" fill="none" stroke="#fff4d2" stroke-width="6" stroke-linecap="round" opacity=".8"/>
    <use href="#ammo-outline" fill="none" stroke="#4b3022" stroke-width="5" stroke-linejoin="round"/>
    <path d="M62 16c-2-8 2-14 8-18" fill="none" stroke="#4b3022" stroke-width="8" stroke-linecap="round"/>
    <path d="M62 16c-2-8 2-14 8-18" fill="none" stroke="#7fb348" stroke-width="4" stroke-linecap="round"/>
    <path d="M69 0c6-6 14-6 16-2-4 6-10 8-16 2Z" fill="#9fd05c" stroke="#4b3022" stroke-width="2.5" stroke-linejoin="round"/>
