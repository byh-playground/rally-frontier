    <path d="M40 46q30-20 70-22M150 30q24 8 38 24" fill="none" stroke="#c99a68" stroke-width="4" stroke-linecap="round"/>
    <g fill="#d3bb92" stroke="#4b3022" stroke-width="2"><ellipse cx="70" cy="54" rx="5" ry="3.5"/><ellipse cx="160" cy="62" rx="4" ry="3"/></g>
  </g>
  <g id="mound-front" transform="translate(242 276)">
    <path d="M6 32C20 14 44 18 58 24c16-14 42-12 54-2 16-12 44-10 56 2 16-10 38-4 46 12 4 16-12 28-42 30H50C20 64 2 50 6 32Z" fill="url(#soil)" stroke="#4b3022" stroke-width="4" stroke-linejoin="round"/>
    <path d="M22 30q16-8 30-2M70 22q24-8 40 2M128 22q22-8 38 2M178 28q14-4 26 6" fill="none" stroke="#c99a68" stroke-width="4" stroke-linecap="round"/>
    <g fill="#d3bb92" stroke="#4b3022" stroke-width="2"><ellipse cx="44" cy="48" rx="5" ry="3.5"/><ellipse cx="150" cy="52" rx="6" ry="4"/><ellipse cx="190" cy="44" rx="3.5" ry="2.5"/></g>
    <path d="M100 26l-4-14 6 8 2-12 4 14" fill="#7fb348" stroke="#4b3022" stroke-width="2.5" stroke-linejoin="round"/>
  </g>

  <g id="launch-ammo" transform="translate(474 196)">
