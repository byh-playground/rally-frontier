<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 272" width="512" height="272">
  <!-- Budmori grain rig art. The seed, feet, hands, expression and cone carbine have separate atlas cells. -->
  <defs>
    <linearGradient id="cream" x1=".2" y1=".08" x2=".8" y2=".94">
      <stop stop-color="#fff1c7"/>
      <stop offset=".51" stop-color="#f0d4a2"/>
      <stop offset="1" stop-color="#ce9e70"/>
    </linearGradient>
    <linearGradient id="limb" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#f4dca8"/>
      <stop offset="1" stop-color="#cd9f73"/>
    </linearGradient>
    <linearGradient id="wood" x1=".22" y1="0" x2=".72" y2="1">
      <stop stop-color="#b99055"/>
      <stop offset="1" stop-color="#765737"/>
    </linearGradient>
    <path id="seedShape" d="M-14-176C0-177 14-157 26-136C42-108 52-82 55-61C62-28 41-12 12-9C-24-6-56-19-56-51C-56-75-44-104-38-128C-32-151-25-173-14-176Z"/>
    <g id="seed">
      <use href="#seedShape" fill="url(#cream)"/>
      <path d="M-10-174C7-147 19-111 26-89C37-55 32-24 17-11C37-14 53-24 56-43C63-81 30-148-8-175Z" fill="#ba8a61" opacity=".23"/>
      <path d="M-32-126C-36-109-41-94-43-80M-27-139l2-5" fill="none" stroke="#fff7db" stroke-width="5" stroke-linecap="round" opacity=".95"/>
      <path d="M-15-169C-11-158-8-151-3-147" fill="none" stroke="#b17a4c" stroke-width="3.5" stroke-linecap="round" opacity=".75"/>
      <path d="M27-31c8-2 12-7 15-12" fill="none" stroke="#bb8a62" stroke-width="3.5" stroke-linecap="round" opacity=".69"/>
      <use href="#seedShape" fill="none" stroke="#68503d" stroke-width="6" stroke-linejoin="round"/>
    </g>
    <g id="neutralEyes">
      <ellipse cx="-13" cy="-4" rx="5.1" ry="6.7" fill="#48382a"/>
      <ellipse cx="16" cy="-4" rx="5.1" ry="6.7" fill="#48382a"/>
      <g fill="#ffefd9">
        <circle cx="-14.1" cy="-6.1" r="1.7"/>
        <circle cx="14.9" cy="-6.1" r="1.7"/>
      </g>
    </g>
    <g id="blush" fill="#d68a71" opacity=".72">
      <ellipse cx="-22" cy="4" rx="5.8" ry="3.4"/>
      <ellipse cx="24.3" cy="4" rx="5.8" ry="3.4"/>
    </g>
  </defs>

  <g id="body" transform="translate(78 195)"><use href="#seed"/></g>
  <g id="foot" transform="translate(199 39)">
    <path d="M-15 1q1-11 15-13 14 0 17 11 1 8-16 9Q-16 9-15 1Z" fill="url(#limb)" stroke="#68503d" stroke-width="4.5"/>
    <path d="M-8-2q4-4 10-4" fill="none" stroke="#fff1c7" stroke-width="2.6" stroke-linecap="round"/>
  </g>
  <g id="hand" transform="translate(265 36)">
    <path d="M-12-2q-2-9 8-11 12-2 16 8 3 10-6 15Q-8 15-12-2Z" fill="url(#limb)" stroke="#68503d" stroke-width="4.5"/>
    <path d="M-7-6q5-4 9 0" fill="none" stroke="#fff1c7" stroke-width="2.4" stroke-linecap="round"/>
  </g>

  <!-- A short wooden body around a pinecone magazine. The muzzle is the rightmost point. -->
  <g id="carbine" transform="translate(363 55)" stroke="#5a4331" stroke-linejoin="round">
    <path d="M-33 1q-10 6-5 14l11 0 18-10-1-13-19-3Z" fill="#957244" stroke-width="4.5"/>
    <path d="M2 3q-4 7 3 17l12 0L20 8Z" fill="#75563b" stroke-width="4.5"/>
    <path d="M27-8l43 0q6 0 7 4 1 4-4 7L31 4Z" fill="#958963" stroke-width="5"/>
    <path d="M69-10l11 0v14h-11z" fill="#a78956" stroke-width="4.5"/>
    <ellipse cx="80" cy="-3" rx="2.3" ry="4" fill="#413729" stroke="none"/>
    <path d="M-29-10Q-9-19 18-16L34-11 36 4 20 11H-17q-16 0-16-9Z" fill="url(#wood)" stroke-width="5"/>
    <path d="M-25-8Q-10-13 7-12" fill="none" stroke="#eed094" stroke-opacity=".85" stroke-width="3" stroke-linecap="round"/>
    <path d="M11-9q10-4 18-2 2 6-3 11l-12 1q-4-4-3-10Z" fill="#819164" stroke-width="3.8"/>
    <path d="M-15 7Q-8 1 2 7Q11 1 16 9Q14 17 7 23Q0 26-7 23Q-14 18-15 7Z" fill="#976e40" stroke-width="4"/>
    <path d="M-13 11q5 3 8 2-1 3 4 7 5-5 4-7 6 1 10-2M-10 18q4 0 6-2m10 0q2 2 5 1" fill="none" stroke="#60472f" stroke-width="2" stroke-linecap="round"/>
  </g>
  <g id="neutral" transform="translate(213 129)">
    <use href="#blush"/><use href="#neutralEyes"/>
    <path d="M-3 7q4 4 8 0" fill="none" stroke="#493729" stroke-width="2.5" stroke-linecap="round"/>
  </g>
  <g id="attack" transform="translate(317 129)">
    <use href="#blush"/><use href="#neutralEyes"/>
    <path d="M-19-14l10 4 M12-10l9-4" fill="none" stroke="#493729" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M-1 8q4-2 7 1" fill="none" stroke="#493729" stroke-width="2.5" stroke-linecap="round"/>
  </g>
  <g id="hurt" transform="translate(421 129)">
    <use href="#blush"/>
    <path d="M-19-8l9 5-9 4 M22-8l-9 5 9 4 M-3 9q5-5 9-1" fill="none" stroke="#493729" stroke-width="3" stroke-linecap="round"/>
  </g>

  <!-- Deployment payload, distinct from the unit's instant hit. -->
  <g id="shell" transform="translate(237 219)">
    <use href="#seed" transform="rotate(83) translate(0 56) scale(.63)"/>
    <path d="M-11-30q11-1 18 2l-1 63q-9 4-20 0z" fill="#7e945d" stroke="#5d5737" stroke-width="3.5" stroke-linejoin="round"/>
    <path d="M-10-10q7 5 14 3M-11 4q7 5 15 3M-12 18q6 5 16 3" fill="none" stroke="#cad893" stroke-width="2.6" stroke-linecap="round" opacity=".88"/>
  </g>
</svg>
