<svg xmlns="http://www.w3.org/2000/svg" width="760" height="731" viewBox="0 0 760 731">
  <title>Dandelion seed v2 B: many thin strands on a pale halo, long natural stalk</title>
  <!--
    민들레씨 v2 파츠 시트 B (실제 민들레 씨앗 구조: 씨앗 몸 꼭대기에서 자루가 자라고 그 끝에 방사형 털).
    단위는 쌀 그림 단위(쌀 서 있는 키 343.5 = artScale 1). 셀 [x, y, w, h] / 회전 중심 [px, py]:
      body     [12,12,190,340] / [95,326]
      canopy   [214,12,468,497] / [234,483]
      foot     [12,521,60,64] / [30,32]
      hand     [84,521,44,60] / [22,30]
      stub     [140,521,36,48] / [18,40]
      bits     [188,521,120,120] / [60,60]
      neutral  [320,521,132,66] / [66,30]
      attack   [464,521,132,66] / [66,30]
      hurt     [608,521,132,66] / [66,30]
      float    [12,653,132,66] / [66,30]
    body 원점 = 두 발 사이 땅. 자루 소켓 = body (0, -310). 얼굴 중심 = body (0, -110).
    canopy = 자루(길이 290) + 털. 원점 = 자루 밑동(소켓에 붙는 점). 솜털을 뗄 때 자루째 날아간다.
    stub = 뗀 뒤 꼭대기에 남는 자루 밑동. bits = 뗄 때 흩어지는 털 조각. 발·손은 하나를 좌우 반전해 재사용.
    표정 4종은 eyes·cheeks 공유 파츠 조합(1차 시안·해바라기씨와 같은 얼굴).
  -->
