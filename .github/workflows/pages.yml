name: Verify source and deploy Pages
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Check browser source syntax and assets
        run: |
          node --check src/main.js
          node --check src/core/game-rules.js
          node --check src/core/build-metadata.js
          node --check campaign/campaigns.js
          node - <<'NODE'
          const fs = require('node:fs');
          const html = fs.readFileSync('index.html','utf8');
          if (!html.includes('src="./src/main.js"') || !html.includes('href="./src/styles/main.css"')) throw Error('Original entrypoint missing');
          const lock=JSON.parse(fs.readFileSync('gamekit.lock.json','utf8'));
          const main=fs.readFileSync('src/main.js','utf8');
          if(!lock.distCommit||!lock.sourceCommit||Object.keys(lock.modules).length!==14||!main.includes("Gamekit module SHA-256 mismatch"))throw Error('Pinned SDK source contract missing');
          for(const path of ['src/styles/main.css','assets/units/manifest.json','campaign/campaigns.js','icons/rally-180.png','manifest.webmanifest']){
            if(!fs.statSync(path).size)throw Error('Missing source asset '+path);
          }
          NODE
          git diff --check
      - name: Copy original source without bundling
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        run: |
          mkdir -p _site
          cp index.html gamekit.lock.json manifest.webmanifest _site/
          cp -R src assets campaign icons _site/
          touch _site/.nojekyll
      - uses: actions/upload-pages-artifact@v4
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        with:
          path: _site
  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - id: deployment
        uses: actions/deploy-pages@v4
