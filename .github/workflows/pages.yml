name: Verify source and deploy Pages
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Install QA dependencies
        run: npm ci
      - name: Install Chromium for source startup verification
        run: npx playwright install --with-deps chromium
      - name: Verify pinned dependencies and source packaging
        run: |
          npm run test:build
          npm run build
          git diff --check
      - name: Verify original ESM and SVG startup in Chromium
        env:
          QA_BROWSER_CHANNEL: chromium
        run: npm run test:startup -- _site/index.html
      - uses: actions/upload-pages-artifact@v4
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        with:
          path: _site
  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - id: deployment
        uses: actions/deploy-pages@v4
