name: Gamekit real-game validation
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
concurrency:
  group: gamekit-validation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  real-game:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      QA_BROWSER_CHANNEL: chromium
      QA_SOFTWARE_GPU: '1'
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: node --test scripts/build-pages.test.cjs && node scripts/build-pages.cjs
      - name: Cached render-state parity and interrupted pointer lifecycle
        run: |
          node scripts/render-store-regression.cjs
          node scripts/pointer-lifecycle-e2e.cjs
      - name: Self-contained HTML without external network
        id: standalone
        continue-on-error: true
        run: node scripts/gamekit-standalone-e2e.cjs _site/index.html
      - name: Bundled module loading and failure paths
        run: node scripts/netcode-loading-regression.cjs _site/index.html
      - name: Real single-player UI, combat, result and replay
        run: node scripts/netcode-ui-e2e.cjs _site/index.html
      - name: Rollback, recovery and authoritative state
        run: |
          node scripts/netcode-integration-regression.cjs _site/index.html
          QA_NETCODE_MODE=rollback node scripts/netcode-integration-regression.cjs _site/index.html
          node scripts/netcode-state-regression.cjs _site/index.html
          node scripts/netcode-session-lifecycle-regression.cjs _site/index.html
          node scripts/netcode-transport-regression.cjs _site/index.html
          node scripts/netcode-ai-regression.cjs _site/index.html
          node scripts/netcode-synctest-regression.cjs _site/index.html
      - name: Save/replay, campaign and input projection
        run: |
          node scripts/replay-import-regression.cjs _site/index.html
          node scripts/camera-render-regression.cjs _site/index.html
          node scripts/minimap-bridge-regression.cjs _site/index.html
          node scripts/campaign-module-regression.cjs
          node scripts/pwa-install-regression.cjs _site
      - name: Existing terrain, fog and pixel regressions
        run: |
          node scripts/ground-depth-regression.cjs _site/index.html
          node scripts/camera-composite-regression.cjs _site/index.html
          node scripts/fog-regression.cjs _site/index.html
          node scripts/fog-spatial-regression.cjs _site/index.html
          node scripts/river-bank-regression.cjs _site/index.html
          node scripts/signed-terrain-regression.cjs _site/index.html
          node scripts/unit-visibility-regression.cjs --html _site/index.html
      - name: Require standalone execution success
        if: always()
        run: test '${{ steps.standalone.outcome }}' = 'success'
      - name: Bounded visual evidence in logs
        if: always()
        run: node scripts/log-visual-evidence.cjs

  performance:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      QA_BROWSER_CHANNEL: chromium
      QA_SOFTWARE_GPU: '1'
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Identical inputs across lockstep and rollback
        run: node scripts/build-pages.cjs && node scripts/netcode-mode-benchmark.cjs _site/index.html
      - name: Measured stages and bounded visual evidence
        if: always()
        run: node scripts/log-visual-evidence.cjs
